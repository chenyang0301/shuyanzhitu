<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>姝言智图 · 北京行政区划演示 Demo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  #map{width:100%;height:100%}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(15,27,45,.9);color:#fff;
    padding:10px 16px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  .topbar b{color:#7cc6ff}
  .topbar span{color:#9fb0cc;font-size:12.5px}
</style>
</head>
<body>
<div class="topbar">
  <div><b>姝言智图</b> · 北京行政区划演示 Demo</div>
  <span>数据：阿里云 DataV GeoAtlas（公开）｜ 底图：OpenStreetMap</span>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', { zoomControl:true }).setView([39.90, 116.40], 9);

  // 底图（OpenStreetMap，公开、无需 token）
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '© OpenStreetMap'
  }).addTo(map);

  // 北京行政区划 GeoJSON（来自阿里云 DataV GeoAtlas 公开接口，WGS-84）
  fetch('https://geo.datav.aliyun.com/areas_v3/bound/110000_full.json')
    .then(r => r.json())
    .then(geo => {
      L.geoJSON(geo, {
        style: { color:'#2563eb', weight:1, fillColor:'#06b6d4', fillOpacity:0.28 },
        onEachFeature: (f, layer) => {
          const name = f.properties && f.properties.name ? f.properties.name : '';
          const adcode = f.properties && f.properties.adcode ? f.properties.adcode : '';
          if (name) layer.bindPopup('<b>' + name + '</b><br>adcode: ' + adcode);
        }
      }).addTo(map);
    })
    .catch(e => alert('数据加载失败，请确认网络可访问公开地图数据（需联网）。'));
</script>
</body>
</html>

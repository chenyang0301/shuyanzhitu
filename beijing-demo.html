<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>姝言智图 · 北京行政区划演示 Demo</title>
<link rel="stylesheet" href="leaflet/leaflet.css" onerror="this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'" />
<style>
  html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  #map{width:100%;height:100%}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(15,27,45,.9);color:#fff;
    padding:10px 16px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  .topbar b{color:#7cc6ff}
  .topbar span{color:#9fb0cc;font-size:12.5px}
  #status{position:fixed;inset:0;z-index:1500;display:none;place-items:center;background:#0f1b2d;
    color:#cbd5e1;font-size:15px;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="topbar">
  <div><b>姝言智图</b> · 北京行政区划演示 Demo</div>
  <span>数据：阿里云 DataV GeoAtlas（公开）｜ 底图：天地图（Key 已填）</span>
</div>
<div id="map"></div>
<div id="status"></div>

<script>
// 本地优先，失败回退 CDN
(function(){
  var s=document.createElement('script'); s.src='leaflet/leaflet.js';
  s.onerror=function(){ var c=document.createElement('script'); c.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'; document.head.appendChild(c); };
  document.head.appendChild(s);
})();
</script>
<script>
// 天地图 Key（浏览器端，已授权域名 shuyanzhitu.cn；若用 github.io 访问需把 chenyang0301.github.io 也加入授权）
const TIANDITU_TOKEN = '66df323b6cb69bba95e4e985e42730f3';
function showError(msg){ var s=document.getElementById('status'); s.style.display='grid';
  s.innerHTML='<div style="color:#f59e0b;max-width:560px;line-height:1.7">'+msg+'</div>'; }
setTimeout(function(){
if (typeof L === 'undefined') {
  showError('⚠ 地图库（Leaflet）加载失败。请确认 leaflet/ 目录已随网页一起部署到同一路径下（自托管，不依赖外网 CDN）。');
} else {
  var map = L.map('map').setView([39.90, 116.40], 9);
  var tianditu = L.tileLayer('https://t{s}.tianditu.gov.cn/DataServer?T=vec_w&x={x}&y={y}&l={z}&tk=' + TIANDITU_TOKEN,
    { subdomains:'01234567', maxZoom:18, attribution:'© 天地图' }).addTo(map);
  L.tileLayer('https://t{s}.tianditu.gov.cn/DataServer?T=cva_w&x={x}&y={y}&l={z}&tk=' + TIANDITU_TOKEN,
    { subdomains:'01234567', maxZoom:18, attribution:'© 天地图' }).addTo(map);

  // 天地图失败（如未授权域名）→ 兜底 智图 GeoQ → Esri ArcGIS
  var fellBack=false;
  tianditu.on('tileerror', function(){
    if(fellBack) return; fellBack=true;
    map.eachLayer(function(l){ map.removeLayer(l); });
    var geoq = L.tileLayer('https://map.geoq.cn/ArcGIS/rest/services/ChinaOnlineCommunity/MapServer/tile/{z}/{y}/{x}',
      { maxZoom:18, attribution:'© 智图 GeoQ' }).addTo(map);
    var f2=false;
    geoq.on('tileerror', function(){
      if(f2) return; f2=true; map.removeLayer(geoq);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
        { maxZoom:19, attribution:'© Esri' }).addTo(map);
    });
  });

  fetch('https://geo.datav.aliyun.com/areas_v3/bound/110000_full.json')
    .then(function(r){ return r.json(); })
    .then(function(geo){
      L.geoJSON(geo, {
        style: { color:'#2563eb', weight:1, fillColor:'#06b6d4', fillOpacity:0.28 },
        onEachFeature: function(f, layer){
          var n = f.properties && f.properties.name ? f.properties.name : '';
          var a = f.properties && f.properties.adcode ? f.properties.adcode : '';
          if (n) layer.bindPopup('<b>' + n + '</b><br>adcode: ' + a);
        }
      }).addTo(map);
    })
    .catch(function(e){ showError('底图已加载，但行政区划数据加载失败（可能是网络拦截了 DataV）。'); });
}
}, 1200);
</script>
</body>
</html>

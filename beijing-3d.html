<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>姝言智图 · 园区三维一张图 Demo（Cesium 3D）</title>
<style>
  html,body,#cesiumContainer{width:100%;height:100%;margin:0;padding:0;overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .hud{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(15,27,45,.86);color:#fff;
    padding:10px 16px;display:none;justify-content:space-between;align-items:center;font-size:13.5px;gap:12px}
  .hud b{color:#7cc6ff;font-size:15px}
  .hud span{color:#9fb0cc}
  #status{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:#0f1b2d;
    color:#cbd5e1;font-size:15px;text-align:center;padding:20px}
  #status small{color:#7c8aa5}
</style>
<script>window.CESIUM_BASE_URL='cesium/';</script>
<script>
// 本地自托管优先；若未部署 cesium/ 目录（如被 GitHub Pages 重定向到 http 自定义域名被浏览器拦截），
// 自动回退到 https CDN，规避"混合内容"拦截导致整页空白。
(function(){
  function loadCDN(){
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/Cesium.js';
    s.onload=function(){ window.CESIUM_BASE_URL='https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/'; window.dispatchEvent(new Event('cesiumReady')); };
    s.onerror=function(){ showError('⚠ 三维地图引擎（Cesium）加载失败：本地 cesium/ 与 CDN 均不可用，请检查网络，或将 cesium 目录随网页一起部署。'); };
    document.head.appendChild(s);
    var l=document.createElement('link'); l.rel='stylesheet';
    l.href='https://cdn.jsdelivr.net/npm/cesium@1.118/Build/Cesium/Widgets/widgets.css'; document.head.appendChild(l);
  }
  var t=document.createElement('script'); t.src='cesium/Cesium.js';
  t.onload=function(){ window.dispatchEvent(new Event('cesiumReady')); };
  t.onerror=loadCDN;
  document.head.appendChild(t);
})();
</script>
</head>
<body>
<div class="hud">
  <div><b>姝言智图</b> · 园区三维一张图 Demo（Cesium 3D）</div>
  <span id="hud-right">底图：智图 GeoQ（免 Key）｜ 行政区划：DataV（公开）｜ 无需 token</span>
</div>
<div id="status">正在加载三维地图引擎…<br><small>（需联网加载 Cesium 与地图数据；若长时间空白，可能是网络拦截了 CDN）</small></div>
<div id="cesiumContainer"></div>

<script>
// 底图：免 Key 方案（原天地图 Key 已失效返回 403）。
// 首选「智图 GeoQ」（国内优化），若加载失败自动兜底到「Esri ArcGIS 全球街道」（已从服务器验证可达）。
function showError(msg){ var s=document.getElementById('status'); s.style.display='grid';
  s.innerHTML='<div style="color:#f59e0b;max-width:560px;line-height:1.7">'+msg+'</div>'; }

window.addEventListener('cesiumReady', function(){
  if (typeof Cesium === 'undefined') {
    showError('⚠ 三维地图引擎（Cesium）加载失败。<br>请确认 cesium/ 目录已随网页一起部署到同一路径下（自托管，不依赖外网 CDN）。');
    return;
  }
  try { initCesium(); } catch(e){ showError('初始化失败：' + (e && e.message ? e.message : e)); }
});

function initCesium(){
  if (!Cesium.FeatureDetection.isWebGLAvailable()) {
    showError('⚠ 当前浏览器/环境不支持 WebGL，无法显示三维地图。<br>请使用较新的 Chrome / Edge，并确认未禁用硬件加速。');
    return;
  }

  var viewer = new Cesium.Viewer('cesiumContainer', {
    baseLayerPicker:false, geocoder:false, homeButton:false, sceneModePicker:false,
    navigationHelpButton:false, animation:false, timeline:false, fullscreenButton:true,
    baseLayer:false
  });
  viewer.cesiumWidget.creditContainer.style.display='none';
  viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#0b1f3a');

  // 首选：智图 GeoQ（国内优化，免 Key）
  var geoq = new Cesium.UrlTemplateImageryProvider({
    url: 'https://map.geoq.cn/ArcGIS/rest/services/ChinaOnlineCommunity/MapServer/tile/{z}/{y}/{x}',
    credit: '© 智图 GeoQ', maximumLevel: 18
  });
  var baseLayer = viewer.imageryLayers.addImageryProvider(geoq);
  var fallbackUsed = false;
  baseLayer.errorEvent.addEventListener(function(){
    if (fallbackUsed) return;
    fallbackUsed = true;
    try { viewer.imageryLayers.remove(baseLayer, true); } catch(e){}
    var arcgis = new Cesium.UrlTemplateImageryProvider({
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      credit: '© Esri', maximumLevel: 19
    });
    viewer.imageryLayers.addImageryProvider(arcgis);
    var hud = document.getElementById('hud-right');
    if (hud) hud.innerHTML = '底图：Esri ArcGIS（GeoQ 兜底）｜ 行政区划：DataV（公开）｜ 无需 token';
  });

  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(116.40, 39.92, 90000),
    orientation:{ heading:Cesium.Math.toRadians(0), pitch:Cesium.Math.toRadians(-35), roll:0 },
    duration:2
  });

  // 行政区划拉伸（DataV GeoAtlas，公开，含中国）
  var palette=['#2563eb','#06b6d4','#7c3aed','#0ea5e9','#14b8a6','#6366f1','#0891b2','#3b82f6'];
  fetch('https://geo.datav.aliyun.com/areas_v3/bound/110000_full.json')
    .then(function(r){return r.json();})
    .then(function(geo){
      var i=0;
      geo.features.forEach(function(f){
        var name=(f.properties&&f.properties.name)||('区域'+i);
        var h=3000+(i*700)%9000;
        var color=Cesium.Color.fromCssColorString(palette[i%palette.length]).withAlpha(0.6);
        Cesium.GeoJsonDataSource.load({type:'FeatureCollection',features:[f]},
          {stroke:Cesium.Color.WHITE,fill:color,strokeWidth:1,extrudedHeight:h,clampToGround:false})
        .then(function(ds){
          viewer.dataSources.add(ds);
          ds.entities.values.forEach(function(en){
            if(en.polygon){ en.polygon.extrudedHeight=h; en.polygon.height=0; en.name=name;
              en.label=new Cesium.LabelGraphics({text:name,font:'13px sans-serif',fillColor:Cesium.Color.WHITE,
                style:Cesium.LabelStyle.FILL_AND_OUTLINE,outlineWidth:2,verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
                pixelOffset:new Cesium.Cartesian2(0,-8),disableDepthTestDistance:Number.POSITIVE_INFINITY}); }
          });
        });
        i++;
      });
      document.getElementById('status').style.display='none';
      document.querySelector('.hud').style.display='flex';
    })
    .catch(function(e){ document.getElementById('status').style.display='none';
      document.querySelector('.hud').style.display='flex';
      console.error('GeoJSON 加载失败', e); });

  [ {name:'示范园区 A',lon:116.39,lat:39.91},{name:'应急指挥点 B',lon:116.45,lat:39.95},{name:'能源站 C',lon:116.33,lat:39.88} ]
  .forEach(function(m){
    viewer.entities.add({ position:Cesium.Cartesian3.fromDegrees(m.lon,m.lat,12000),
      point:{pixelSize:12,color:Cesium.Color.fromCssColorString('#f59e0b'),outlineColor:Cesium.Color.WHITE,outlineWidth:2},
      label:{text:m.name,font:'13px sans-serif',fillColor:Cesium.Color.WHITE,showBackground:true,
        backgroundColor:Cesium.Color.fromCssColorString('#0f1b2d').withAlpha(0.7),
        pixelOffset:new Cesium.Cartesian2(0,-22),disableDepthTestDistance:Number.POSITIVE_INFINITY} });
  });
}
</script>
</body>
</html>

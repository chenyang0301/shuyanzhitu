<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>姝言智图 · 园区三维一张图 Demo（Cesium 3D）</title>
<style>
  html,body,#cesiumContainer{width:100%;height:100%;margin:0;padding:0;overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .hud{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(15,27,45,.86);color:#fff;
    padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;gap:12px}
  .hud b{color:#7cc6ff;font-size:15px}
  .hud span{color:#9fb0cc}
  #status{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:#0f1b2d;
    color:#cbd5e1;font-size:15px;text-align:center;padding:20px}
  #status small{color:#7c8aa5}
</style>
<script>window.CESIUM_BASE_URL='https://fastly.jsdelivr.net/npm/cesium@1.95.0/Build/Cesium/';</script>
<script src="https://fastly.jsdelivr.net/npm/cesium@1.95.0/Build/Cesium/Cesium.js"></script>
<link href="https://fastly.jsdelivr.net/npm/cesium@1.95.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
</head>
<body>
<div class="hud">
  <div><b>姝言智图</b> · 园区三维一张图 Demo（Cesium 3D）</div>
  <span id="hud-right">底图：天地图（公开）｜ 行政区划：DataV（公开）｜ 无需 token</span>
</div>
<div id="status">正在加载三维地图引擎…<br><small>（需联网加载 Cesium 与地图数据；若长时间空白，可能是 CDN 被网络拦截）</small></div>
<div id="cesiumContainer"></div>

<script>
// 👇 在此粘贴你的天地图 Key（https://www.tianditu.gov.cn 注册后免费申请）
const TIANDITU_TOKEN = '';

function showError(msg){ var s=document.getElementById('status'); s.style.display='grid';
  s.innerHTML='<div style="color:#f59e0b;max-width:560px;line-height:1.7">'+msg+'</div>'; }

window.addEventListener('load', function(){
  if (typeof Cesium === 'undefined') {
    showError('⚠ 三维地图引擎（Cesium）加载失败。<br>通常是网络无法访问 CDN（fastly.jsdelivr.net）。<br>解决：换用国内可访问网络，或将 Cesium 自托管到国内服务器 / 对象存储。');
    return;
  }
  try { initCesium(); } catch(e){ showError('初始化失败：' + (e && e.message ? e.message : e)); }
});

function initCesium(){
  var viewer = new Cesium.Viewer('cesiumContainer', {
    baseLayerPicker:false, geocoder:false, homeButton:false, sceneModePicker:false,
    navigationHelpButton:false, animation:false, timeline:false, fullscreenButton:true,
    // 先不要默认底图，下面手动加天地图或 OSM 兜底
    imageryProvider: false
  });
  viewer.cesiumWidget.creditContainer.style.display='none';

  // 地球底色（之前传错参数导致报错，现在正确设置）
  viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#0b1f3a');

  // 底图：天地图（有 Key）或 OSM（兜底）
  if (TIANDITU_TOKEN) {
    document.getElementById('hud-right').textContent = '底图：天地图（Key 已填）｜ 行政区划：DataV（公开）｜ 无需 Cesium ion token';
    var vec = new Cesium.UrlTemplateImageryProvider({
      url: 'https://t{s}.tianditu.gov.cn/vec_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=' + TIANDITU_TOKEN,
      subdomains: '01234567', maximumLevel: 18, credit: '天地图'
    });
    var cva = new Cesium.UrlTemplateImageryProvider({
      url: 'https://t{s}.tianditu.gov.cn/cva_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cva&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=' + TIANDITU_TOKEN,
      subdomains: '01234567', maximumLevel: 18, credit: '天地图'
    });
    viewer.imageryLayers.addImageryProvider(vec);
    viewer.imageryLayers.addImageryProvider(cva);
  } else {
    document.getElementById('hud-right').innerHTML = '底图：OSM（兜底）｜ 行政区划：DataV（公开）｜ <span style="color:#f59e0b">天地图 Key 未填</span>';
    viewer.imageryLayers.addImageryProvider(
      new Cesium.OpenStreetMapImageryProvider({ url: 'https://tile.openstreetmap.org/' })
    );
  }

  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(116.40, 39.92, 90000),
    orientation:{ heading:Cesium.Math.toRadians(0), pitch:Cesium.Math.toRadians(-35), roll:0 },
    duration:2
  });

  var palette=['#2563eb','#06b6d4','#7c3aed','#0ea5e9','#14b8a6','#6366f1','#0891b2','#3b82f6'];
  fetch('https://geo.datav.aliyun.com/areas_v3/bound/110000_full.json')
    .then(function(r){return r.json();})
    .then(function(geo){
      var i=0;
      geo.features.forEach(function(f){
        var name=(f.properties&&f.properties.name)||('区域'+i);
        var h=3000+(i*700)%9000;
        var color=Cesium.Color.fromCssColorString(palette[i%palette.length]).withAlpha(0.6);
        Cesium.GeoJsonDataSource.load({type:'FeatureCollection',features:[f]},
          {stroke:Cesium.Color.WHITE,fill:color,strokeWidth:1,extrudedHeight:h,clampToGround:false})
        .then(function(ds){
          viewer.dataSources.add(ds);
          ds.entities.values.forEach(function(en){
            if(en.polygon){ en.polygon.extrudedHeight=h; en.polygon.height=0; en.name=name;
              en.label=new Cesium.LabelGraphics({text:name,font:'13px sans-serif',fillColor:Cesium.Color.WHITE,
                style:Cesium.LabelStyle.FILL_AND_OUTLINE,outlineWidth:2,verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
                pixelOffset:new Cesium.Cartesian2(0,-8),disableDepthTestDistance:Number.POSITIVE_INFINITY}); }
          });
        });
        i++;
      });
      document.getElementById('status').style.display='none';
    })
    .catch(function(e){ document.getElementById('status').style.display='none'; console.error('GeoJSON 加载失败', e); });

  [ {name:'示范园区 A',lon:116.39,lat:39.91},{name:'应急指挥点 B',lon:116.45,lat:39.95},{name:'能源站 C',lon:116.33,lat:39.88} ]
  .forEach(function(m){
    viewer.entities.add({ position:Cesium.Cartesian3.fromDegrees(m.lon,m.lat,12000),
      point:{pixelSize:12,color:Cesium.Color.fromCssColorString('#f59e0b'),outlineColor:Cesium.Color.WHITE,outlineWidth:2},
      label:{text:m.name,font:'13px sans-serif',fillColor:Cesium.Color.WHITE,showBackground:true,
        backgroundColor:Cesium.Color.fromCssColorString('#0f1b2d').withAlpha(0.7),
        pixelOffset:new Cesium.Cartesian2(0,-22),disableDepthTestDistance:Number.POSITIVE_INFINITY} });
  });
}
</script>
</body>
</html>
